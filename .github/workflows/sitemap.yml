name: Auto Sitemap

on:
  push:
    branches:
      - main

jobs:
  generate-sitemap:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: main

      - name: Generate sitemap
        run: |
          DOMAIN="https://yogeshjirel.com.np"
          SITEMAP="sitemap.xml"

          echo '<?xml version="1.0" encoding="UTF-8"?>' > $SITEMAP
          echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' >> $SITEMAP

          find . -name "*.html" ! -name "sitemap.xml" ! -path "./.github/*" | while read FILE; do
            FILE_URL="${FILE#./}"
            FILE_URL="${FILE_URL/index.html/}"
            echo "  <url><loc>$DOMAIN/$FILE_URL</loc><changefreq>monthly</changefreq><priority>0.7</priority></url>" >> $SITEMAP
          done

          if [ -f "posts.json" ]; then
            cat posts.json | jq -r '.[] | select(.draft != true) | .id' | while read ID; do
              echo "  <url><loc>$DOMAIN/blog/$ID/</loc><changefreq>weekly</changefreq><priority>0.8</priority></url>" >> $SITEMAP
            done
          fi

          echo '</urlset>' >> $SITEMAP
          cat $SITEMAP

      - name: Commit sitemap
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add sitemap.xml
          git commit -m "Auto-update sitemap" || echo "No changes"
          git push origin main
         
      - name: Notify Google
        run: curl "http://www.google.com/ping?sitemap=https://yogeshjirel.com.np/sitemap.xml"
