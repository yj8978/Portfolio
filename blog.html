<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Blog Post</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<meta name="google-site-verification" content="La6tvcFECCjUCFLIbKxmqchhqEQMH9u2i0bM48Tnq6k" />
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
</head>
<body>

<nav class="navbar">
  <div class="post-nav-container">
    <a href="https://yogeshjirel.com.np/" class="logo">YJ</a>

    <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <ul class="nav-menu" id="navMenu">
      <li><a href="https://yogeshjirel.com.np/blogs">Blogs</a></li>
      <li><a href="https://yogeshjirel.com.np/#projects">Projects</a></li>
    </ul>
  </div>
</nav>

<div class="post-container">
  <h1 class="post-title" id="title"></h1>
  <div class="post-meta" id="meta"></div>
  <article class="post-content" id="content"></article>
  <div class="post-footer">
    Fleeting thoughts of mine . Thanks for reading
  </div>
</div>

<script>
const toggle = document.getElementById("menuToggle");
const menu = document.getElementById("navMenu");

toggle.addEventListener("click", () => {
  menu.classList.toggle("show");
  toggle.classList.toggle("active"); // <-- toggle X animation
});

// Close menu after click (mobile UX)
menu.querySelectorAll("a").forEach(link => {
  link.addEventListener("click", () => {
    menu.classList.remove("show");
    toggle.classList.remove("active"); // <-- reset X
  });
});
// blog
const params = new URLSearchParams(window.location.search);
const postId = params.get("id");

fetch("posts.json")
  .then(res => res.json())
  .then(posts => {
    const post = posts.find(p => p.id === postId);
    if (!post) {
      document.getElementById("title").innerText = "Post Not Found";
      return;
    }

    document.getElementById("title").innerText = post.title;
    document.getElementById("meta").innerText = `${post.date} · ${post.readTime}`;
    document.getElementById("content").innerHTML = post.content;
  });
</script>

</body>
</html>
